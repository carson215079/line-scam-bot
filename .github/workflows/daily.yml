name: Daily Tasks

on:
  schedule:
    - cron: '0 */3 * * *'   # 每 3 小時爬取
    - cron: '0 1 * * *'     # 09:00 台灣時間推播 (UTC+8)
    - cron: '0 20 * * *'    # 04:00 台灣時間清理 (UTC+8)
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        type: choice
        options:
          - crawl
          - broadcast
          - cleanup

env:
  LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
  LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "task=broadcast" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            echo "task=cleanup" >> "$GITHUB_OUTPUT"
          else
            echo "task=crawl" >> "$GITHUB_OUTPUT"
          fi

      - name: Run task
        run: python scripts/run_tasks.py ${{ steps.task.outputs.task }}
